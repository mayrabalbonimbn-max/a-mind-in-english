# Nginx | A Mind in English — https://mind.balbonilab.com
# Isolated server block: touches no other site on this VPS.
# App (Express, pm2 "amind-api") listens only on 127.0.0.1:3420.
#
# Install:
#   cp deploy/nginx-mind.balbonilab.com.conf /etc/nginx/sites-available/mind.balbonilab.com
#   ln -s /etc/nginx/sites-available/mind.balbonilab.com /etc/nginx/sites-enabled/mind.balbonilab.com
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d mind.balbonilab.com --redirect
# certbot then adds the listen 443 / certificate lines and the HTTP -> HTTPS redirect.

upstream amind_app {
    server 127.0.0.1:3420;
    keepalive 8;
}

server {
    server_name mind.balbonilab.com;
    listen 80;
    listen [::]:80;

    client_max_body_size 12m;

    # HTTPS only for this host (no includeSubDomains: other *.balbonilab.com sites are unaffected)
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Server-Sent Events (cross-device sync): no buffering, long-lived
    location = /api/sync/events {
        proxy_pass http://amind_app;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://amind_app;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI feedback can take up to ~2 minutes
        proxy_read_timeout 180s;
        proxy_connect_timeout 5s;
    }
}
